---
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact TAISCH." />
    <title>TAISCH — Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="images/taisch-aodhan.jpg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    {% include topbar.html %}
    <main class="contact-page">
      <div class="contact-page-inner">
        <p class="eyebrow">{{ site.data.contact.eyebrow }}</p>
        <h1>{{ site.data.contact.title }}.</h1>
        <p class="contact-lede">{{ site.data.contact.lede }}</p>
        <div class="contact-grid">
          {% for method in site.data.contact.contact_methods %}
          <div class="contact-block">
            <h2>{{ method.header }}</h2>
            <a href="{{ method.url }}"{% unless method.url contains 'mailto:' %} target="_blank" rel="noopener"{% endunless %}>{{ method.text }}</a>
          </div>
          {% endfor %}
        </div>
      </div>
    </main>
  </body>
</html>

main_about: |
    What does the future look like? How will it be experienced by all those who inhabit it? What kind of world do we want to create for our children, and what decisions can we make now in order to lead us in the right direction?

    Such questions must not be left solely to the engineers in Sillicon Valley, nor solely to the policymakers in Ottawa. They are questions that all who share this earth must ask ourselves and grapple with together. 

    It is the responsibility of artists to provoke thought, imagine possibilities, and inspire lasting change. The Toronto AI Safety Coffeehouse (TAISCH) seeks to catalyse this work by showcasing art and artists whose creations may help guide us toward a future of human flourishing in the face of AI.


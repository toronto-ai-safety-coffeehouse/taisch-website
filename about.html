---
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="About TAISCH." />
    <title>TAISCH — About Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="images/taisch-aodhan.jpg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    {% include topbar.html %}
    <main class="contact-page">
      <div class="contact-page-inner">
        <h1>About Us</h1>
        <div class="about-copy">
          {{ site.data.about.main_about | markdownify }}
        </div>
        <div class="team-section">
          <p class="eyebrow">The Team</p>
          <div class="team-grid">
            {% for person in site.data.about.team %}
            <div class="profile-card">
              <div class="profile-avatar">{{ person.initials }}</div>
              <div class="profile-text">
                <p class="profile-name">{{ person.name }}</p>
                <p class="profile-title">{{ person.title }}</p>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

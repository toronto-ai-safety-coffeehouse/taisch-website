---
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TAISCH — The Toronto AI Safety Coffeehouse." />
    <title>TAISCH — The Toronto AI Safety Coffeehouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="images/taisch-aodhan.jpg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    {% include topbar.html %}
    <main class="construction-page">
      <div class="construction-art" role="img" aria-label="Abstract painting in vivid green, red, blue, and pink"></div>
      <div class="construction-content">
        <div class="hero-copy">
          <div class="construction-brand">TAISCH</div>
          <h1>{{ site.data.index.title }}</h1>
          <p class="tagline">{{ site.data.index.tagline }}</p>
        </div>
        <div class="sponsor-strip">
          <p class="eyebrow">Supported by</p>
          <div class="sponsor-logos">
            {% for sponsor in site.data.index.sponsors %}
            <a href="{{ sponsor.url }}" target="_blank" rel="noopener">
              <img class="{{ sponsor.logo_class }}" src="{{ sponsor.logo }}" alt="{{ sponsor.name }}" />
            </a>
            {% endfor %}
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
